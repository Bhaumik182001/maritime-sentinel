services:
  db:
    image: mongo:6.0
    container_name: maritime_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - maritime-net

  redis:
    image: redis:7-alpine
    container_name: maritime_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - maritime-net
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: maritime_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/maritime_surveillance
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
      - redis
    networks:
      - maritime-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: maritime_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - maritime-net

volumes:
  mongo_data:
  redis_data:

networks:
  maritime-net:
    driver: bridge
